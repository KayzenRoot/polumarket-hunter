name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to package
        required: true
        default: main
      dry_run:
        description: Package without publishing a GitHub release
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      PUBLISH_REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Clean install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild esbuild

      - name: Build
        run: npm run build

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --omit=dev --package-lock-only > sbom.cdx.json

      - name: Package production artifact
        run: |
          set -euo pipefail
          npm prune --omit=dev --no-audit --no-fund
          SAFE_REF="${PUBLISH_REF//\//-}"
          ARTIFACT="polyhunter-${SAFE_REF}-linux-x64.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --use-compress-program='gzip -9n' \
            -cf "$ARTIFACT" \
            package.json package-lock.json README.md LICENSE .env.example docs \
            node_modules \
            packages/core/package.json packages/core/dist \
            packages/polymarket/package.json packages/polymarket/dist \
            packages/persistence/package.json packages/persistence/dist \
            packages/testkit/package.json packages/testkit/dist \
            apps/server/package.json apps/server/dist apps/web/dist
          sha256sum "$ARTIFACT" sbom.cdx.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Smoke test packaged artifact
        run: |
          set -euo pipefail
          ARTIFACT="polyhunter-${PUBLISH_REF//\//-}-linux-x64.tar.gz"
          SMOKE_DIR="$RUNNER_TEMP/polyhunter-smoke"
          SMOKE_LOG="$RUNNER_TEMP/polyhunter-smoke.log"
          rm -rf "$SMOKE_DIR"
          mkdir -p "$SMOKE_DIR"
          tar -xzf "$ARTIFACT" -C "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          PORT=8795 HOST=127.0.0.1 DEMO_MODE=true NODE_ENV=production \
            DATABASE_PATH="$RUNNER_TEMP/polyhunter-smoke.db" \
            RECORD_DIR="$RUNNER_TEMP/polyhunter-recordings" \
            LOG_LEVEL=error node apps/server/dist/main.js > "$SMOKE_LOG" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill -TERM "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8795/api/health > "$RUNNER_TEMP/health.json"; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            echo "release artifact did not become healthy"
            cat "$SMOKE_LOG"
            exit 1
          fi
          HEALTH_PATH="$RUNNER_TEMP/health.json" node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync(process.env.HEALTH_PATH, "utf8"));
            if (!r.ok || r.data.status !== "running" || r.data.mode !== "paper" || r.data.liveAllowed !== false) {
              console.error(r);
              process.exit(1);
            }
          '
          curl -fsS http://127.0.0.1:8795/ -o "$RUNNER_TEMP/index.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/index.html"
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"action":"kill"}' http://127.0.0.1:8795/api/control -o "$RUNNER_TEMP/kill.json"
          KILL_PATH="$RUNNER_TEMP/kill.json" node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync(process.env.KILL_PATH, "utf8"));
            if (!r.ok || r.data.health.status !== "killed" || r.data.health.killReason !== "operator kill switch") {
              console.error(r);
              process.exit(1);
            }
          '
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"action":"reset-kill"}' http://127.0.0.1:8795/api/control -o "$RUNNER_TEMP/reset.json"
          RESET_PATH="$RUNNER_TEMP/reset.json" node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync(process.env.RESET_PATH, "utf8"));
            if (!r.ok || r.data.health.status !== "running") {
              console.error(r);
              process.exit(1);
            }
          '
          echo "packaged artifact smoke passed"

      - name: Write release notes
        run: |
          set -euo pipefail
          TAG="${PUBLISH_REF}"
          ARTIFACT="polyhunter-${PUBLISH_REF//\//-}-linux-x64.tar.gz"
          BASE="https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}"
          if [ -f docs/research/v0.1-evidence.md ]; then
            RESEARCH="[decision memo](${BASE}/docs/research/v0.1-evidence.md)"
          else
            RESEARCH="Decision memo pending (#29); this tag is not the production evidence gate."
          fi
          cat > release-notes.md <<EOF
          # PolyHunter ${TAG}

          Local, single-user, paper-first production artifact.

          - [Production contract](${BASE}/docs/PRODUCTION-CONTRACT.md)
          - ${RESEARCH}
          - [Production plan](${BASE}/docs/PRODUCTION-PLAN.md)
          - [Runbook](${BASE}/docs/RUNBOOK.md)
          - [Fees and assumptions](${BASE}/docs/FEES.md)

          ## Install

          1. Verify SHA256SUMS with: sha256sum -c SHA256SUMS
          2. Extract ${ARTIFACT}.
          3. Copy .env.example to .env and set DATABASE_PATH, RECORD_DIR and any overrides.
          4. Run: node apps/server/dist/main.js with Node 24.

          No wallet, private key or exchange secret is needed or included. Live trading is not
          implemented. The venue geoblock remains enforced; do not bypass it.

          ## Evidence

          - SBOM: sbom.cdx.json (CycloneDX)
          - Checksums: SHA256SUMS
          - Artifact: ${ARTIFACT}
          EOF

      - name: Upload dry-run assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            polyhunter-*-linux-x64.tar.gz
            sbom.cdx.json
            SHA256SUMS
          retention-days: 7

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARTIFACT="polyhunter-${PUBLISH_REF//\//-}-linux-x64.tar.gz"
          if gh release view "$PUBLISH_REF" >/dev/null 2>&1; then
            gh release upload "$PUBLISH_REF" "$ARTIFACT" sbom.cdx.json SHA256SUMS --clobber
            gh release edit "$PUBLISH_REF" --notes-file release-notes.md
          else
            gh release create "$PUBLISH_REF" "$ARTIFACT" sbom.cdx.json SHA256SUMS \
              --title "PolyHunter $PUBLISH_REF" \
              --notes-file release-notes.md \
              --verify-tag
          fi
